server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    # CanvasKit lives under a version-stamped path and is safe to cache hard.
    location ^~ /canvaskit/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # IMPORTANT: `flutter build web` does NOT content-fingerprint its entry
    # files — `main.dart.js`, `flutter_bootstrap.js`, `flutter_service_worker.js`,
    # `flutter.js`, `version.json`, deferred `*.part.js`, and even `assets/*`
    # keep STABLE names while their content changes every build. Caching them as
    # `immutable` means a redeploy never reaches the browser for the cache
    # lifetime, so the SPA runs stale code (blank pages, no requests, no errors).
    #
    # We therefore use `no-cache` for everything: the browser MAY cache, but
    # MUST revalidate on every load (cheap 304s via ETag/Last-Modified), so a
    # deploy is always picked up on the next refresh.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # The app shell must never be served from cache at all.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
