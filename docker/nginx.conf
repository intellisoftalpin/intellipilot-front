server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    # Long cache for fingerprinted static assets emitted by `flutter build web`.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # The app shell must never be stale — Flutter rewrites the asset
    # manifest, but index.html is what bootstraps the rest.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback: pathUrlStrategy needs unknown paths to fall through to
    # index.html so go_router can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
