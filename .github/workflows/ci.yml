name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: lint + test + build (web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version
        id: flutter-version
        run: |
          version=$(jq -r .flutter .fvmrc)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format check
        # Pin language version to 3.6 so the short-style formatter is used.
        # pubspec.yaml's `sdk: ^3.12.0` otherwise opts the formatter into
        # Dart 3.7+ "tall style" and would reformat every file in the repo.
        run: dart format --output=none --set-exit-if-changed --language-version=3.6 lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests with coverage
        run: flutter test --coverage

      - name: Build web bundle
        run: flutter build web --release
