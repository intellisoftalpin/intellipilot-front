name: intellipilot
description: "IntelliPilot frontend client (Jira-grade project management)."
publish_to: 'none'
version: 0.2.5+11

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Phase 0 deliberately keeps runtime dependencies minimal. Phase 1 (foundation)
# adds the bloc / DI / routing / dio / hive / freezed stack. The dev section
# below already wires up codegen tooling so Phase 1 can hit the ground running.
dependencies:
  bloc: ^9.0.0
  collection: ^1.18.0
  cookie_jar: ^4.0.8
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  dynamic_color: ^1.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.0.0
  get_it: ^8.0.0
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  intl: any
  json_annotation: ^4.9.0
  logger: ^2.4.0
  path_provider: ^2.1.4
  reactive_forms: ^17.0.1
  uuid: ^4.5.0
  web: ^1.1.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  very_good_analysis: ^8.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
