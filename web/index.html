<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IntelliPilot frontend client">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="intellipilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>intellipilot</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Service-worker "new build ready" banner. Styled to match the
       IntelliPilot indigo theme; rendered above the Flutter canvas so it
       remains visible even if the SPA is stuck. */
    #ip-sw-banner {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f1f3b;
      color: #f8fafc;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.25);
      font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: none;
      align-items: center;
      gap: 14px;
      z-index: 999999;
    }
    #ip-sw-banner button {
      background: #5B5BD6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    #ip-sw-banner button:hover {
      background: #6e6ee0;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="ip-sw-banner" role="status" aria-live="polite">
    <span>A new version is available.</span>
    <button type="button" onclick="window.location.reload()">Reload now</button>
  </div>
  <script>
    // Watch the Flutter-generated service worker for updates. When the new
    // build finishes installing (and the user already has the old one open),
    // surface a banner inviting them to reload. Pure JS so it works even if
    // the Flutter canvas is wedged on the old assets.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('ip-sw-banner').style.display = 'flex';
              }
            });
          });
        });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
